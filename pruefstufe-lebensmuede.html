<title>Prüfstufe Lebensmüde</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone column over a living forest canvas. Sticky HUD on top, an illustrated stage per place, cards below, inventory docked at the bottom. */
:root {
  --night: #0b1210;
  --bark: rgba(17, 27, 23, .86);
  --bark-solid: #111b17;
  --moss: #1c2a24;
  --line: #2d4037;
  --fg: #e2e7dd;
  --muted: #93a69c;
  --lantern: #f2a93b;
  --lantern-soft: #f2a93b33;
  --blood: #ff3d5e;
  --uv: #7a45ff;
  --ok: #5fcb8f;
  --bad: #f0605c;
  --paper: #e9dfc6;
  --ink: #2a2118;
  --brass: #c9a24a;
  --f-display: "IM Fell English SC", Georgia, "Times New Roman", serif;
  --f-diary: "IM Fell English", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --vig: 0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--night); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bark-solid); }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
#app { position: relative; z-index: 1; min-height: 100%; }
#vig { position: fixed; inset: 0; z-index: 14; pointer-events: none; background: radial-gradient(ellipse at center, transparent 52%, rgba(110, 0, 18, var(--vig)) 100%); }
#vig.throb { animation: throb var(--beat, .8s) infinite; }
@keyframes throb { 0%, 100% { opacity: 1; } 18% { opacity: .55; } }

.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- intro / briefing ---------- */
.cover { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-block: 32px; gap: 20px; }
.cover > p { text-shadow: 0 1px 6px #000; }
.form-card { background: var(--paper); color: var(--ink); border-radius: 4px; padding: 20px 18px 44px; box-shadow: 0 18px 40px #000a; position: relative; }
.form-card h1 { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.05; margin: 0 0 4px; text-wrap: balance; }
.agency { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; opacity: .75; }
.form-rows { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 16px 0 6px; font-size: .95rem; }
.form-rows dt { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; opacity: .7; padding-top: 3px; }
.form-rows dd { margin: 0; border-bottom: 1px dashed #2a211855; padding-bottom: 4px; font-weight: 700; }
.stamp { position: absolute; right: 14px; bottom: 12px; transform: rotate(-7deg); border: 2px solid #a3271f; color: #a3271f; font-family: var(--f-mono); font-size: .62rem; letter-spacing: .1em; padding: 4px 6px; text-transform: uppercase; opacity: .85; }
.rules { margin: 10px 0 0; padding-left: 0; list-style: none; counter-reset: r; display: grid; gap: 10px; }
.rules li { counter-increment: r; display: grid; grid-template-columns: 28px 1fr; gap: 6px; }
.rules li::before { content: counter(r); font-family: var(--f-display); font-size: 1.4rem; line-height: 1; color: #7a1f17; }
.sheet .rules li::before { color: var(--lantern); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--moss); cursor: pointer; font-weight: 700; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--lantern); color: #1d1206; border-color: var(--lantern); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 44px; padding: 6px 14px; font-size: .9rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.hint-line { color: var(--muted); font-size: .85rem; text-align: center; }

/* ---------- HUD ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bark-solid); border-bottom: 1px solid var(--line); }
.hud-row { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 10px; padding-block: 8px; }
.timer { font-family: var(--f-mono); font-weight: 700; font-size: 1.45rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--lantern); }
.timer.over { color: var(--bad); }
.pulse { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.pulse svg { width: 18px; height: 18px; fill: var(--blood); animation: beat var(--beat, .85s) infinite; }
.pulse.hot { color: var(--blood); }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.28); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
.hud-btns { display: flex; gap: 6px; }
.icon-btn { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--moss); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; font-size: .85rem; font-weight: 700; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .85rem; cursor: pointer; }
.chip.on { background: var(--lantern); color: #1d1206; border-color: var(--lantern); font-weight: 700; }
.chip.done::after { content: " ✓"; }
.chip[disabled] { opacity: .35; cursor: default; }
@media (max-width: 359px) { .timer { font-size: 1.2rem; } .pulse { font-size: .75rem; } .icon-btn { padding: 0 8px; } }

/* ---------- scene ---------- */
main.scene { padding-block: 16px 130px; display: grid; gap: 14px; }
.place { font-family: var(--f-display); font-size: 2rem; line-height: 1; margin: 0; text-wrap: balance; text-shadow: 0 2px 10px #000; }
.lede { color: var(--muted); margin: -6px 0 0; text-shadow: 0 1px 6px #000; }
.card { background: var(--bark); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card h3 { margin: 0; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card p { margin: 0; }
.say { font-family: var(--f-diary); font-size: 1.12rem; line-height: 1.35; }
.say b { font-family: var(--f-body); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--lantern); display: block; margin-bottom: 2px; }
.note { background: var(--paper); color: var(--ink); border-radius: 3px; padding: 14px; transform: rotate(-.6deg); box-shadow: 0 8px 20px #0006; display: grid; gap: 8px; }
.note .head { font-family: var(--f-diary); font-style: italic; }
.clue { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.digits { display: flex; gap: 3px; }
.digits span { width: 26px; height: 32px; display: grid; place-items: center; background: #2a2118; color: var(--paper); font-family: var(--f-mono); font-weight: 700; border-radius: 3px; }
.clue p { margin: 0; font-size: .92rem; line-height: 1.25; }
.lock { display: flex; gap: 8px; justify-content: center; }
.wheel { display: grid; grid-template-rows: 44px 56px 44px; width: 58px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #0d1512; }
.wheel button { border: 0; background: var(--moss); cursor: pointer; font-size: 1rem; }
.wheel output { display: grid; place-items: center; font-family: var(--f-mono); font-size: 1.8rem; font-weight: 700; background: linear-gradient(#0000, #ffffff08, #0000); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.between { justify-content: space-between; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.found { border-color: var(--lantern); box-shadow: 0 0 0 1px var(--lantern-soft), 0 0 30px var(--lantern-soft); }
.danger-box { border-style: dashed; }
.chalk { font-family: var(--f-display); font-size: 1.5rem; letter-spacing: .06em; color: #f5f2ea; }
.score { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }

/* ---------- illustrated stage ---------- */
.stage { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: #050907; box-shadow: 0 14px 36px #000b; }
.stage > svg { display: block; width: 100%; height: auto; }
.stage .hot { cursor: pointer; }
.bubble { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: 86%; background: var(--paper); color: var(--ink); border-radius: 14px; padding: 7px 12px; font-family: var(--f-diary); font-size: 1rem; line-height: 1.25; box-shadow: 0 6px 16px #000a; animation: pop .25s ease-out; z-index: 2; text-align: center; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; border: 7px solid transparent; border-top-color: var(--paper); border-bottom: 0; transform: translateX(-50%); }
@keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }
.uvsvg { display: none; }
body.uv .uvsvg { display: inline; }
body.uv::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 15; background: radial-gradient(70% 55% at 50% 45%, #7a45ff30, #2a0f6aa0); mix-blend-mode: screen; }
.uvsvg text { font-family: var(--f-display); fill: #ffd6de; paint-order: stroke; stroke: #ff3d5e; stroke-width: 3px; filter: url(#f-glow); }

/* svg animation helpers: transform-box keeps origins local to each shape */
.fb { transform-box: fill-box; }
.lid-eye { transform-box: fill-box; transform-origin: center top; animation: blink 5.2s infinite; transform: scaleY(0); }
.lid-eye.slow { animation-duration: 7.3s; animation-delay: 1.4s; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(0); } 95%, 97% { transform: scaleY(1); } }
.breath { transform-box: fill-box; transform-origin: center bottom; animation: breath 3.6s ease-in-out infinite; }
@keyframes breath { 50% { transform: scale(1.018, 1.03); } }
.flame { transform-box: fill-box; transform-origin: center bottom; animation: flicker .22s infinite alternate; }
.flame.b { animation-duration: .31s; }
.flame.c { animation-duration: .17s; }
@keyframes flicker { from { transform: scale(1, .9) skewX(2deg); opacity: .85; } to { transform: scale(.94, 1.08) skewX(-3deg); opacity: 1; } }
.glow-pulse { animation: gp 2.4s ease-in-out infinite; }
@keyframes gp { 50% { opacity: .55; } }
.fogdrift { animation: drift 14s ease-in-out infinite alternate; }
.fogdrift.b { animation-duration: 19s; animation-direction: alternate-reverse; }
@keyframes drift { to { transform: translateX(40px); } }
.far-eyes { animation: fareyes 11s infinite; opacity: 0; }
@keyframes fareyes { 0%, 70%, 82%, 100% { opacity: 0; } 72%, 76%, 80% { opacity: 1; } 74%, 78% { opacity: 0; } }
/* gate */
.wing-l { transform-box: fill-box; transform-origin: left center; }
.wing-r { transform-box: fill-box; transform-origin: right center; }
.padlock { transform-box: fill-box; transform-origin: center; }
.opened .wing-l, .opened .wing-r { transform: scaleX(.16); }
.opened .padlock { opacity: 0; }
.opening .wing-l, .opening .wing-r { animation: swing 1.6s .5s cubic-bezier(.5, 0, .3, 1) both; }
.opening .padlock { animation: dropLock .9s ease-in both; }
@keyframes swing { from { transform: scaleX(1); } 30% { transform: scaleX(.92); } to { transform: scaleX(.16); } }
@keyframes dropLock { 0% { transform: none; } 25% { transform: translateY(-4px); } 100% { transform: translateY(70px) rotate(50deg); opacity: 0; } }
/* bridge */
.sway { animation: sway 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 180px 70px; }
@keyframes sway { 25% { transform: rotate(.7deg); } 75% { transform: rotate(-.7deg); } }
.darkness { transition: opacity .6s; }
/* forester */
.foerster { transition: transform .8s ease; }
.f-arm { transform-box: fill-box; transform-origin: 0% 100%; }
.f-miss .f-arm { animation: chop .6s ease-out; }
.f-hit .f-body { animation: flinch .6s ease-out; transform-box: fill-box; transform-origin: center bottom; }
@keyframes chop { 30% { transform: rotate(-60deg); } 55% { transform: rotate(25deg); } }
@keyframes flinch { 30% { transform: rotate(-9deg) translateX(-4px); } }
.ghost { opacity: 0; }
.ghost.show { animation: ghost 2.6s 1.6s ease-in-out both; }
@keyframes ghost { 0%, 100% { opacity: 0; } 20%, 62% { opacity: 1; } 64% { opacity: 0; } 66% { opacity: 1; } 70% { opacity: 0; } }
.gen-run { animation: jitter .09s infinite; transform-box: fill-box; }
@keyframes jitter { 50% { transform: translate(.6px, -.5px); } }
.puff { transform-box: fill-box; transform-origin: center; animation: puff 2.4s linear infinite; opacity: 0; }
.puff.b { animation-delay: .8s; }
.puff.c { animation-delay: 1.6s; }
@keyframes puff { 0% { transform: translate(0, 0) scale(.4); opacity: .55; } 100% { transform: translate(10px, -36px) scale(1.8); opacity: 0; } }
.win-lit { animation: winflicker 4s infinite; }
@keyframes winflicker { 0%, 100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: .6; } 49% { opacity: 1; } }
/* chests */
.chests { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
.chest { border: 0; background: none; padding: 4px 0 0; cursor: pointer; display: grid; gap: 4px; justify-items: center; border-radius: 12px; }
.chest svg { width: 100%; height: auto; overflow: visible; transition: transform .25s; }
.chest .clabel { font-size: .8rem; color: var(--muted); }
.chest.sel svg { transform: translateY(-6px); filter: drop-shadow(0 0 10px var(--lantern-soft)) drop-shadow(0 0 3px var(--lantern)); }
.chest.sel .clabel { color: var(--lantern); font-weight: 700; }
.lid { transform-box: fill-box; transform-origin: 8% 100%; }
.lid-open .lid { transform: translate(-6px, -12px) rotate(-24deg); }
.lid-opening .lid { animation: lidup .7s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes lidup { from { transform: none; } to { transform: translate(-6px, -12px) rotate(-24deg); } }
.gem { opacity: 0; }
.lid-open .gem, .lid-opening .gem { animation: gemrise .9s .35s ease-out both; }
@keyframes gemrise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(-6px); } }
.engr { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; border: 1px solid transparent; }
.engr.sel { border-color: var(--lantern); background: #f2a93b14; }
.engr .sw { width: 14px; height: 40px; border-radius: 4px; }
.pig { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.pig .w { display: flex; gap: 2px; }
.pig svg { width: 21px; height: 21px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: square; }
.pig svg circle { fill: currentColor; stroke: none; }
.keygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.keygrid div { border: 1px solid var(--line); border-radius: 8px; display: grid; justify-items: center; padding: 6px 0 4px; gap: 2px; }
.keygrid svg { width: 26px; height: 26px; stroke: var(--fg); stroke-width: 2; fill: none; stroke-linecap: square; }
.keygrid svg circle { fill: var(--fg); stroke: none; }
.keygrid b { font-family: var(--f-mono); font-size: .85rem; }
.diary { background: var(--paper); color: var(--ink); padding: 14px 16px; border-radius: 3px; font-family: var(--f-diary); font-size: 1.08rem; line-height: 1.4; box-shadow: 0 8px 20px #0006; }
.diary small { display: block; text-align: right; font-style: italic; margin-top: 6px; }
/* door */
.leaf-l { transform-box: fill-box; transform-origin: left center; }
.leaf-r { transform-box: fill-box; transform-origin: right center; }
.door-opening .leaf-l, .door-opening .leaf-r { animation: leaves 2s .4s cubic-bezier(.6, 0, .3, 1) both; }
@keyframes leaves { to { transform: scaleX(.04); } }
.door-light { opacity: 0; }
.door-opening .door-light { animation: dl 2.4s .5s ease-in both; }
@keyframes dl { to { opacity: 1; } }
.rune { color: #6f7a74; transition: color .3s; }
.rune.set { color: #b9aef5; }
.altar-wrong .rune.set { animation: runered 1.2s; }
@keyframes runered { 0%, 60% { color: #ff3d5e; } }
.drip { opacity: 0; }
.altar-wrong .drip { animation: drip 2.4s ease-in both; }
@keyframes drip { 0% { opacity: 0; transform: scaleY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: scaleY(1); } }
.altar-wrong .num46 { animation: num46 2s; }
@keyframes num46 { 0%, 70% { fill: #ff3d5e; } }

/* bridge controls */
.banks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bank { border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 120px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bank h4 { margin: 0; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 4px; flex-wrap: wrap; }
.bank.lamp { border-color: var(--lantern); background: linear-gradient(var(--lantern-soft), transparent 70%); }
.person { min-width: 0; overflow-wrap: anywhere; text-align: left; min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--moss); cursor: pointer; font-size: .88rem; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.person span { font-family: var(--f-mono); color: var(--muted); flex: none; }
.person.sel { background: var(--lantern); color: #1d1206; border-color: var(--lantern); }
.person.sel span { color: #1d1206; }
.meter { height: 10px; border-radius: 99px; background: #0d1512; border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--lantern); transition: width .4s; }
.meter.bad i { background: var(--bad); }

/* fencing */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--moss); cursor: pointer; line-height: 1.3; }

/* jugs */
.jugs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: end; }
.jug { border: 0; background: none; cursor: pointer; display: grid; gap: 6px; justify-items: center; padding: 0; }
.jug svg { width: 100%; max-width: 96px; height: auto; overflow: visible; }
.jug .lab { font-size: .8rem; color: var(--muted); text-align: center; }
.jug.sel svg { filter: drop-shadow(0 0 8px var(--lantern)); transform: translateY(-4px); }
.fluid { transition: y .4s, height .4s; }

/* altar controls */
.inscription { font-family: var(--f-diary); font-size: 1.05rem; display: grid; gap: 6px; padding-left: 0; margin: 0; list-style: none; }
.inscription li { padding-left: 16px; position: relative; }
.inscription li::before { content: "†"; position: absolute; left: 0; color: var(--muted); }
.sockets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.socket { display: grid; gap: 6px; text-align: center; }
.socket .pos { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.slot { min-height: 52px; border-radius: 8px; border: 1px dashed var(--muted); background: #0d1512; cursor: pointer; font-size: .74rem; padding: 4px 2px; line-height: 1.15; overflow-wrap: anywhere; }
.slot.filled { border-style: solid; border-color: var(--lantern); background: var(--moss); font-weight: 700; }
.slot.rune.filled { border-color: #a99cf2; }

/* inventory */
.inv { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bark-solid); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.inv .wrap { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; align-items: center; }
.inv .wrap::-webkit-scrollbar { display: none; }
.inv .label { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); flex: none; }
.item { flex: none; min-width: 74px; min-height: 58px; border-radius: 10px; border: 1px solid var(--line); background: var(--moss); cursor: pointer; display: grid; justify-items: center; align-content: center; gap: 2px; padding: 4px 8px; font-size: .75rem; font-weight: 700; }
.item svg { width: 24px; height: 24px; stroke: var(--lantern); fill: none; stroke-width: 1.8; }
.item.active { border-color: var(--uv); box-shadow: 0 0 14px var(--uv); position: relative; }
.uv-count { position: absolute; top: 3px; right: 3px; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 10px; background: var(--uv); color: #fff; font-family: var(--f-mono); font-size: .75rem; display: grid; place-items: center; }
.item.new { animation: glow 1.6s 2; }

/* ================= sound ================= */
const Sound = {
  ctx: null,
  init() {
    if (this.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) this.ctx = new Ctx();
  },
  on() { return instanceRunning && S.sound && this.ctx && this.ctx.state !== 'closed'; },
  tone(freq, dur, type = 'sine', gain = 0.2, delay = 0, endFreq) {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noiseBuffer(dur) {
    const c = this.ctx, buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },
  noise(dur, gain, cutoff, delay = 0, type = 'lowpass', q = 1) {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuffer(dur); f.type = type; f.frequency.value = cutoff; f.Q.value = q;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  },
  click() { this.tone(1900, 0.03, 'square', 0.05); this.tone(950, 0.04, 'square', 0.04, 0.025); },
  clunk() { this.tone(110, 0.3, 'triangle', 0.45); this.noise(0.18, 0.35, 900); },
  ok() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.16, i * 0.09)); },
  bad() { this.tone(150, 0.35, 'sawtooth', 0.12); this.tone(112, 0.45, 'sawtooth', 0.1, 0.06); },
  thunder() { this.noise(2.8, 0.7, 260); this.noise(1.2, 0.4, 700, 0.15); },
  /** One soft thump: starts at 120 Hz so small phone speakers can carry it, then drops into the bass. */
  thump(at, gain) {
    const c = this.ctx, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, at); o.frequency.exponentialRampToValueAtTime(48, at + 0.16);
    f.type = 'lowpass'; f.frequency.value = 380;
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(gain, at + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.24);
    o.connect(f).connect(g).connect(c.destination); o.start(at); o.stop(at + 0.26);
  },
  /** Lub-dub: a strong thump, then a softer one 0.2 s later. */
  beat(delay = 0) {
    if (!this.on()) return;
    const at = this.ctx.currentTime + delay;
    this.thump(at, 0.7); this.thump(at + 0.2, 0.45);
  },
  pour() { this.noise(0.6, 0.2, 1800, 0, 'bandpass', 2); },
  creak() {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.value = 85; lfo.frequency.value = 9; lg.gain.value = 25;
    lfo.connect(lg).connect(o.frequency); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 3;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
    o.connect(f).connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t + 1.4); lfo.stop(t + 1.4);
  },
  scream() {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime;
    [1, 1.5, 2.02].forEach((m, i) => {
      const o = c.createOscillator(), g = c.createGain(), ws = c.createWaveShaper();
      const curve = new Float32Array(256); for (let k = 0; k < 256; k++) { const x = k / 128 - 1; curve[k] = Math.tanh(x * 6); }
      ws.curve = curve; o.type = 'sawtooth';
      o.frequency.setValueAtTime(820 * m, t); o.frequency.exponentialRampToValueAtTime(260 * m, t + 1.1);
      g.gain.setValueAtTime(0.16 / (i + 1), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.connect(ws).connect(g).connect(c.destination); o.start(t); o.stop(t + 1.25);
    });
    this.noise(1.1, 0.6, 1500, 0, 'bandpass', 0.8);
    this.tone(48, 1.2, 'sine', 0.7);
  },
  screech() { for (let i = 0; i < 9; i++) this.tone(3200 + Math.random() * 2200, 0.05, 'square', 0.04, i * 0.07 + Math.random() * 0.03); this.noise(0.8, 0.15, 4000, 0, 'highpass'); },
  whisper() {
    if (!this.on()) return;
    const c = this.ctx, t = c.currentTime, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
    src.buffer = this.noiseBuffer(2); f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 3;
    lfo.frequency.value = 7; lg.gain.value = 0.12; lfo.connect(lg).connect(g.gain);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.18, t + 0.5); g.gain.linearRampToValueAtTime(0.0001, t + 1.9);
    src.connect(f).connect(g).connect(c.destination); src.start(t); lfo.start(t); lfo.stop(t + 2);
  },
  splash() { this.noise(0.5, 0.35, 2200); this.tone(300, 0.15, 'sine', 0.15, 0, 120); },
  rumble() { this.noise(2.4, 0.6, 140); this.tone(42, 2.2, 'sine', 0.5); },
  steps() { for (let i = 0; i < 6; i++) this.noise(0.12, 0.35, 300, i * 0.22); },
};
function buzz(pattern) { if (navigator.vibrate) navigator.vibrate(pattern); }

// One background bed per place; an owl now and then outside the salon, and a low drone under the heartbeat in room 46.
const BEDS = { tor: 'crickets', bruecke: 'wind', forsthaus: 'crickets', salon: 'fire', altar: 'heart' };
const HEART_EVERY_MS = 30000;
const HEART_BURST_MS = 8000;
const HEART_BPM_START = 60;
const HEART_BPM_END = 150;
const HEART_BPM_MAX = 170;
const Ambience = {
  wind: null, drone: null, heartFrom: 0, nextBeat: 0,
  bed() { return S.sound && S.screen === 'game' && !blackoutRunning ? BEDS[S.loc] : ''; },
  start() {
    if (this.wind || !Sound.ctx) return;
    const c = Sound.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain();
    src.buffer = Sound.noiseBuffer(4); src.loop = true; f.type = 'lowpass'; f.frequency.value = 420;
    g.gain.value = 0; lfo.frequency.value = 0.11; lg.gain.value = 0.02; lfo.connect(lg).connect(g.gain);
    src.connect(f).connect(g).connect(c.destination); src.start(); lfo.start();
    this.wind = g;
    this.timer = setInterval(() => this.tick(), 1000);
    this.apply();
  },
  apply() {
    if (!this.wind) return;
    const bed = this.bed();
    this.wind.gain.setTargetAtTime(bed === 'wind' ? 0.045 : 0, Sound.ctx.currentTime, 0.6);
    if (bed !== 'heart') this.heartFrom = 0;
    else if (!this.heartFrom) { this.heartFrom = Date.now(); this.nextBeat = 0; }
    const wantDrone = bed === 'heart';
    if (wantDrone && !this.drone) {
      const c = Sound.ctx, g = c.createGain(); g.gain.value = 0; g.connect(c.destination);
      const os = [55, 55.6, 82.4].map(f => { const o = c.createOscillator(); o.frequency.value = f; o.connect(g); o.start(); return o; });
      g.gain.setTargetAtTime(0.06, c.currentTime, 1);
      this.drone = { g, os };
    } else if (!wantDrone && this.drone) {
      const d = this.drone; this.drone = null;
      d.g.gain.setTargetAtTime(0, Sound.ctx.currentTime, 0.3);
      setTimeout(() => d.os.forEach(o => o.stop()), 1500);
    }
  },
  /** Heart rate in room 46: rises steadily towards the 30-minute mark. */
  heartRate() { return Math.min(HEART_BPM_MAX, HEART_BPM_START + (HEART_BPM_END - HEART_BPM_START) * elapsed() / DURATION); },
  tick() {
    if (!Sound.on()) return;
    const bed = this.bed();
    if (bed === 'crickets' && Math.random() < 0.45) {
      for (let i = 0; i < 3; i++) Sound.tone(4600 + Math.random() * 300, 0.035, 'sine', 0.012, i * 0.07);
    }
    if (bed === 'fire') for (let i = 0; i < 4; i++) if (Math.random() < 0.5) Sound.noise(0.03, 0.12, 2500, Math.random() * 0.9, 'highpass');
    if (bed === 'heart') this.heart();
    if (bed && bed !== 'fire' && Math.random() < 0.03) { Sound.tone(390, 0.35, 'sine', 0.05, 0, 340); Sound.tone(340, 0.5, 'sine', 0.05, 0.45, 300); }
  },
  /** Plays the heartbeat in bursts and schedules the next second of beats on the audio clock, so the rhythm stays even. */
  heart() {
    const c = Sound.ctx;
    if (!this.heartFrom || (Date.now() - this.heartFrom) % HEART_EVERY_MS >= HEART_BURST_MS) { this.nextBeat = 0; return; }
    if (this.nextBeat < c.currentTime) this.nextBeat = c.currentTime + 0.05;
    while (this.nextBeat < c.currentTime + 1.1) {
      Sound.beat(this.nextBeat - c.currentTime);
      this.nextBeat += 60 / this.heartRate();
    }
  },
};

/* ================= time & pulse ================= */
function elapsed() {
  if (!S.startedAt) return 0;
  const now = S.finishedAt || Date.now();
  const hiddenNow = S.hiddenAt ? now - S.hiddenAt : 0;
  return now - S.startedAt + S.penalty - S.paused - hiddenNow;
}
// The clock stops while the page is not visible (phone locked, other app, tab closed).
function clockRunning() { return S.startedAt && !S.finishedAt; }
function pauseClock() {
  if (!clockRunning() || S.hiddenAt) return;
  S.hiddenAt = Date.now(); save();
}
function resumeClock() {
  if (!S.hiddenAt) return;
  S.paused += Date.now() - S.hiddenAt; S.hiddenAt = 0; save();
}
// A hidden page (phone locked, other app or tab) stays silent, so two open copies never play over each other.
document.addEventListener('visibilitychange', () => {
  if (!instanceRunning) return;
  if (document.hidden) { pauseClock(); if (Sound.ctx) Sound.ctx.suspend(); }
  else { resumeClock(); lastAct = Date.now(); if (Sound.ctx) Sound.ctx.resume(); }
});
addEventListener('pagehide', () => { if (instanceRunning) pauseClock(); });
function pulseNow() {
  const base = 72 + Math.min(40, elapsed() / MINUTE * 1.3);
  return Math.round(Math.min(185, base + S.stress));
}
function stress(amount) { S.stress = Math.max(0, S.stress + amount); }
function fmt(ms) {
  const s = Math.floor(Math.abs(ms) / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function hintsUsed() { return Object.values(S.hints).reduce((a, b) => a + b, 0) + S.fenceAnswers.length; }

/* ================= feedback ================= */
const toastBox = document.getElementById('toasts');
const fxLayer = document.getElementById('fx');
// Messages come one at a time: the next one appears only after Konrad taps "Gelesen" on the current one.
const toastQueue = [];
/** Queues a message; the same text is never shown or queued twice at once. */
function toast(text, kind = '', who = GAME_MASTER) {
  if ([...toastBox.children].some(t => t.dataset.text === text) || toastQueue.some(q => q.text === text)) return;
  toastQueue.push({ text, kind, who });
  if (toastBox.children.length) updateWaitingCount(); else showNextToast();
}
function showNextToast() {
  const next = toastQueue.shift();
  if (!next) { showPendingBubble(); return; }
  const el = document.createElement('div');
  el.dataset.text = next.text;
  el.className = 'toast ' + next.kind;
  el.innerHTML = (next.who ? '<b>' + esc(next.who) + '</b>' : '') + esc(next.text) + '<button class="toast-ok" type="button">Gelesen</button>';
  el.querySelector('.toast-ok').addEventListener('click', () => { el.remove(); showNextToast(); });
  toastBox.appendChild(el);
  updateWaitingCount();
}
/** Tells Konrad on the button how many messages still wait behind the current one. */
function updateWaitingCount() {
  const button = toastBox.querySelector('.toast-ok');
  if (button) button.textContent = toastQueue.length ? 'Gelesen · noch ' + toastQueue.length : 'Gelesen';
}
/** Records a radio line for the Funkprotokoll in the menu; only lines Konrad has already heard end up there. */
function logFunk(text) { if (!S.funkLog.includes(text)) S.funkLog.push(text); }
/** A radio line from the game master: comes only once and is kept in the Funkprotokoll. */
function radio(text, kind = '') {
  if (S.funkLog.includes(text)) return;
  logFunk(text); save(); toast(text, kind);
}
function shake(selector) {
  const el = document.querySelector(selector);
  if (!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function unlock(id) {
  if (S.ach[id]) return;
  S.ach[id] = Date.now();
  toast(ACHIEVEMENTS[id][0] + ': ' + ACHIEVEMENTS[id][1], 'achievement', 'Achievement');
}
function failure(text, amount = 8) {

  if (text) toast(text, 'bad');
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function give(id) { if (!S.inv.includes(id)) { S.inv.push(id); S.newItem = id; } }

function takeButton(id, label) { return has(id) ? '' : '<div class="row"><button class="btn primary" data-act="take" data-id="' + id + '">' + label + '</button></div>'; }
// A speech bubble waits while a message is on screen, otherwise the message would hide it.
let pendingBubble = null;
/** Shows the waiting speech bubble once the last message is read, if Konrad is still in the same place. */
function showPendingBubble() {
  const waiting = pendingBubble;
  pendingBubble = null;
  if (waiting && waiting.loc === S.loc && S.screen === 'game') bubble(waiting.text);
}
function bubble(text) {
  if (toastBox.children.length) { pendingBubble = { text, loc: S.loc }; return; }
  const stage = document.querySelector('.stage');
  if (!stage) return;
  stage.querySelectorAll('.bubble').forEach(b => b.remove());
  const b = document.createElement('div');
  b.className = 'bubble'; b.textContent = text;
  stage.appendChild(b);
  setTimeout(() => b.remove(), 3400);
}

const VOICE_RATE = 0.88;
const VOICE_PART_GAP = 0.35;
const VOICE_TARGET_PEAK = 0.8;
const Voice = {
  clips: {},
  reverb: null,
  /** Decodes a clip once and measures its loudest sample, so quiet and loud recordings come out equally loud. */
  async load(name) {
    if (this.clips[name]) return this.clips[name];
    const bytes = Uint8Array.from(atob(VOICE_CLIPS[name].data), ch => ch.charCodeAt(0));
    const buffer = await Sound.ctx.decodeAudioData(bytes.buffer);
    let peak = 0;
    for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
      const samples = buffer.getChannelData(channel);
      for (let i = 0; i < samples.length; i++) peak = Math.max(peak, Math.abs(samples[i]));
    }
    this.clips[name] = { buffer, gain: Math.min(4, VOICE_TARGET_PEAK / Math.max(peak, 0.01)) };
    return this.clips[name];
  },
  /** A 2.5-second decaying noise burst as the room for the reverb. */
  room() {
    if (this.reverb) return this.reverb;
    const c = Sound.ctx, length = Math.floor(c.sampleRate * 2.5), impulse = c.createBuffer(2, length, c.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const d = impulse.getChannelData(channel);
      for (let i = 0; i < length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3);
    }
    this.reverb = c.createConvolver();
    this.reverb.buffer = impulse;
    this.reverb.connect(c.destination);
    return this.reverb;
  },
  /** Plays one recording; silent when the sound is off. */
  async say(name) {
    if (!Sound.on()) return;
    const c = Sound.ctx, clip = await this.load(name);
    const level = c.createGain(), dark = c.createBiquadFilter(), dry = c.createGain(), wet = c.createGain();
    level.gain.value = clip.gain;
    dark.type = 'lowpass'; dark.frequency.value = 3200;
    dry.gain.value = 0.75; wet.gain.value = 0.55;
    level.connect(dark);
    dark.connect(dry).connect(c.destination);
    dark.connect(wet).connect(this.room());
    let at = c.currentTime + 0.05;
    VOICE_CLIPS[name].parts.forEach(([from, to]) => {
      const source = c.createBufferSource();
      source.buffer = clip.buffer;
      source.playbackRate.value = VOICE_RATE;
      source.connect(level);
      source.start(at, from, to - from);
      at += (to - from) / VOICE_RATE + VOICE_PART_GAP;
    });
  },
};

  add(html, ms) {

    const node = el.firstElementChild;
    fxLayer.appendChild(node);
    setTimeout(() => node.remove(), ms);
    return node;

  ambulance() {

/* ================= living forest backdrop ================= */
const Backdrop = (() => {
  const canvas = document.getElementById('bg'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, layers = [], flies = [], fogs = [], eyes = null, runner = null, lastFrame = 0;
  function seeded(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function pine(g, x, base, h, w) {
    g.fillRect(x - w * 0.05, base - h * 0.22, w * 0.1, h * 0.22);
    for (let k = 0; k < 4; k++) {
      const top = base - h + k * h * 0.19, bot = top + h * 0.36, half = w * (0.18 + k * 0.1);
      g.beginPath(); g.moveTo(x, top); g.lineTo(x - half, bot); g.lineTo(x + half, bot); g.closePath(); g.fill();
    }
  }
  function build() {
    W = canvas.width = innerWidth; H = canvas.height = innerHeight;
    const specs = [
      { color: '#12211b', base: 0.80, hMin: 0.22, hMax: 0.38, gap: 34, seed: 7 },
      { color: '#0c1713', base: 0.90, hMin: 0.30, hMax: 0.50, gap: 52, seed: 19 },
      { color: '#060c0a', base: 1.02, hMin: 0.42, hMax: 0.70, gap: 90, seed: 41 },
    ];
    layers = specs.map(s => {
      const off = document.createElement('canvas'); off.width = W; off.height = H;
      const g = off.getContext('2d'), r = seeded(s.seed);
      g.fillStyle = s.color;
      for (let x = -20; x < W + 40; x += s.gap * (0.6 + r() * 0.8)) {
        const h = H * (s.hMin + r() * (s.hMax - s.hMin));
        pine(g, x, H * s.base, h, h * (0.38 + r() * 0.12));
      }
      g.fillRect(0, H * s.base - 2, W, H);
      return off;
    });
    const r = seeded(5);
    flies = Array.from({ length: 14 }, () => ({ x: r() * W, y: H * (0.45 + r() * 0.5), p: r() * 6.28, s: 0.4 + r() * 0.8 }));
    fogs = Array.from({ length: 5 }, (_, i) => ({ x: r() * W, y: H * (0.6 + r() * 0.35), w: W * (0.5 + r() * 0.6), v: (r() - 0.5) * 0.25, layer: i % 2 }));
  }
  function drawFog(layer) {
    fogs.filter(f => f.layer === layer).forEach(f => {
      f.x += f.v; if (f.x > W + f.w) f.x = -f.w; if (f.x < -f.w) f.x = W + f.w;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.w / 2);
      g.addColorStop(0, 'rgba(160,185,172,.10)'); g.addColorStop(1, 'rgba(160,185,172,0)');
      ctx.fillStyle = g; ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1, 0.28); ctx.translate(-f.x, -f.y);
      ctx.beginPath(); ctx.arc(f.x, f.y, f.w / 2, 0, 6.29); ctx.fill(); ctx.restore();
    });
  }
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - lastFrame < 40) return;
    lastFrame = t;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#0e1d18'); sky.addColorStop(0.6, '#08110e'); sky.addColorStop(1, '#040706');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    const mx = W * 0.78, my = H * 0.13, glow = ctx.createRadialGradient(mx, my, 0, mx, my, 110);
    glow.addColorStop(0, 'rgba(232,228,207,.28)'); glow.addColorStop(1, 'rgba(232,228,207,0)');
    ctx.fillStyle = glow; ctx.fillRect(mx - 120, my - 120, 240, 240);
    ctx.fillStyle = '#e4e0c8'; ctx.beginPath(); ctx.arc(mx, my, 24, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#0e1d18'; ctx.beginPath(); ctx.arc(mx + 9, my - 5, 21, 0, 6.29); ctx.fill();
    ctx.drawImage(layers[0], 0, 0);
    drawFog(0);
    ctx.drawImage(layers[1], 0, 0);
    if (eyes) {
      const age = t - eyes.t0;
      if (age > 3200) eyes = null;
      else {
        const open = !((age > 900 && age < 1050) || (age > 1900 && age < 2050)) && age > 200 && age < 3000;
        if (open) {
          ctx.fillStyle = '#ffd34d'; ctx.shadowColor = '#ffb300'; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.ellipse(eyes.x, eyes.y, 3, 1.6, 0, 0, 6.29); ctx.ellipse(eyes.x + 11, eyes.y, 3, 1.6, 0, 0, 6.29); ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }
    if (runner) {
      const p = (t - runner.t0) / 1700;
      if (p > 1) runner = null;
      else {
        const x = -60 + p * (W + 120), y = H * 0.86 - Math.abs(Math.sin(p * 30)) * 6;
        ctx.fillStyle = '#020302';
        ctx.beginPath(); ctx.ellipse(x, y - 34, 11, 20, 0.5, 0, 6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 12, y - 54, 8, 0, 6.29); ctx.fill();
        ctx.lineWidth = 5; ctx.strokeStyle = '#020302'; ctx.beginPath();
        const s = Math.sin(p * 30) * 10;
        ctx.moveTo(x, y - 18); ctx.lineTo(x - 6 + s, y + 6); ctx.moveTo(x, y - 18); ctx.lineTo(x + 6 - s, y + 6);
        ctx.moveTo(x + 4, y - 44); ctx.lineTo(x + 22, y - 30 + s); ctx.stroke();
      }
    }
    drawFog(1);
    ctx.drawImage(layers[2], 0, 0);
    flies.forEach(f => {
      f.p += 0.05 * f.s; f.x += Math.cos(f.p * 0.7) * 0.4; f.y += Math.sin(f.p * 0.5) * 0.3;
      const a = 0.25 + 0.75 * Math.max(0, Math.sin(f.p * 1.7));
      ctx.fillStyle = 'rgba(242,214,107,' + a.toFixed(2) + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, 1.6, 0, 6.29); ctx.fill();
    });
  }
  function start() {
    build();
    addEventListener('resize', build);
    if (reducedMotion) { frame(1000); return; }
    requestAnimationFrame(frame);
  }
  return {
    start,
    eyes() { eyes = { x: W * (0.1 + Math.random() * 0.75), y: H * (0.68 + Math.random() * 0.12), t0: performance.now() }; },
    runner() { runner = { t0: performance.now() }; },
  };
})();

function lookAt(x, y) {

}

function pigpenSvg(letter) {
  const code = letter.charCodeAt(0) - 65;
  let parts = '';
  if (code < 18) {
    const i = code % 9, dotted = code >= 9, row = Math.floor(i / 3), col = i % 3;
    if (row > 0) parts += '<path d="M3 3H17"/>';
    if (row < 2) parts += '<path d="M3 17H17"/>';
    if (col > 0) parts += '<path d="M3 3V17"/>';
    if (col < 2) parts += '<path d="M17 3V17"/>';
    if (dotted) parts += '<circle cx="10" cy="10" r="2"/>';
  } else {
    const i = (code - 18) % 4, dotted = code >= 22;
    const shapes = ['M3 3L10 16L17 3', 'M3 3L16 10L3 17', 'M17 3L4 10L17 17', 'M3 17L10 4L17 17'];
    const dots = [[10, 7], [7, 10], [13, 10], [10, 13]];
    parts += '<path d="' + shapes[i] + '"/>';
    if (dotted) parts += '<circle cx="' + dots[i][0] + '" cy="' + dots[i][1] + '" r="2"/>';
  }
  return '<svg viewBox="0 0 20 20" aria-hidden="true">' + parts + '</svg>';
}
function pigpenText(text) {
  return '<div class="pig" role="img" aria-label="Gravur in Geheimschrift">' +

}

  { id: 'salon', name: 'Salon', open: () => S.jugsDone, done: () => S.boxDone },
  { id: 'altar', name: 'Raum 46', open: () => has('amulett'), done: () => S.altarDone },
];

function hintKey() {
  switch (S.loc) {
    case 'tor': return S.gate ? 'torDone' : 'tor';
    case 'bruecke': return !S.lit ? (has('laterne') ? 'dunkel' : 'ohneLaterne') : S.bridgeDone ? 'brueckeDone' : 'bruecke';
    case 'forsthaus': return !S.fenceDone ? 'foerster' : !has('schablone') ? 'liegtDa' : !S.kanUsed ? (has('kanister') ? 'kanister' : 'ohneKanister') : S.jugsDone ? 'forsthausDone' : 'jugs';
    case 'salon': return !has('schablone') ? 'ohneSchablone' : !S.boxDone ? 'salon' : has('amulett') ? 'salonDone' : 'liegtDa';
    default: return 'altar';
  }
}

function render() {
  document.body.classList.toggle('uv', S.uv && S.screen === 'game');
  if (S.screen === 'intro') app.innerHTML = viewIntro();
  else if (S.screen === 'brief') app.innerHTML = viewBriefing();
  else if (S.screen === 'finale') app.innerHTML = viewFinale();
  else app.innerHTML = viewGame();
  S.newItem = '';
  once.clear();
  const chip = document.querySelector('.chip.on');
  if (chip) chip.parentElement.scrollLeft = chip.offsetLeft - chip.parentElement.clientWidth / 2 + chip.clientWidth / 2;
  lookAt(lookX, lookY);
  const hud = document.querySelector('.hud');
  toastBox.style.top = (hud ? Math.round(hud.getBoundingClientRect().bottom) + 8 : 16) + 'px';
  afterRender.splice(0).forEach(fn => fn());
  Ambience.apply();
  tick();
}

/* ================= fencing ================= */
function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/** Next fencing round. After a miss the forester tells the right retort, and missed insults come back twice as often, so losing teaches (as in Monkey Island). */
function newFenceRound(prev, prevWasHit) {
  const wins = prev ? prev.wins : 0;
  const solved = prev ? (prev.solved || []).concat(prevWasHit ? [prev.cur] : []) : [];
  const missed = prev ? (prev.missed || []).filter(i => i !== prev.cur).concat(prevWasHit ? [] : [prev.cur]) : [];
  const choices = INSULTS.map((_, i) => i).filter(i => !solved.includes(i) && (!prev || i !== prev.cur));
  const cur = pick(choices.concat(choices.filter(i => missed.includes(i))));
  const others = shuffle(INSULTS.map((x, i) => i).filter(i => i !== cur)).slice(0, 2).map(i => INSULTS[i].retort);
  return { wins, cur, solved, missed, lastMiss: prev && !prevWasHit ? prev.cur : -1, opts: shuffle([INSULTS[cur].retort, ...others, pick(LAME)]) };
}

/* ================= bridge walking ================= */
let crossAnim = null;
function animateCrossing(onDone) {
  const { ids, from, dt } = crossAnim;
  const els = ids.map(id => document.getElementById('w-' + id)).filter(Boolean);
  const lan = document.getElementById('lan-walk'), rest = document.getElementById('lan-rest');
  if (rest) rest.style.display = 'none';
  if (lan) lan.style.display = '';
  const duration = reducedMotion ? 10 : Math.max(700, dt * WALK_MS_PER_MINUTE);
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / duration);
    const t = from === 'L' ? p : 1 - p;
    els.forEach((el, k) => {
      const [x, y] = bez(Math.min(1, Math.max(0, t + (from === 'L' ? -k * 0.04 : k * 0.04))), DECK);
      const bob = Math.abs(Math.sin(p * duration / 110)) * 1.6;
      el.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + (y - bob).toFixed(1) + ') scale(1.3)');
    });
    if (lan) { const [x, y] = bez(t, DECK); lan.setAttribute('transform', 'translate(' + (x + (from === 'L' ? 6 : -6)).toFixed(1) + ' ' + (y - 14).toFixed(1) + ')'); }
    if (p < 1) requestAnimationFrame(step);
    else { crossAnim = null; onDone(); }
  };
  requestAnimationFrame(step);
}

    Sound.init();
    if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
    Ambience.start();
    Sound.thunder(); Fx.flash();
    S.screen = 'brief'; S.briefOpenedAt = Date.now();
  },
  briefDone() {
    const now = Date.now();
    S.startedAt = now; S.screen = 'game';
    if (now - S.briefOpenedAt < SKIPPER_LIMIT_MS) unlock('skipper');
    setTimeout(() => radio('Funkcheck. Wir hören dich, Konrad. Viel Glück. Du wirst es brauchen.'), 600);
  },
  go(el) {
    const loc = LOCS.find(l => l.id === el.dataset.loc);
    if (!loc || !loc.open() || crossAnim) return;
    if (S.loc === 'bruecke' && S.bridgeDone && !S.seen.bierjunge && loc.id !== 'bruecke') {
      Sound.tone(98, 0.5, 'sawtooth', 0.18, 0, 70);
      trollCheers = true;
      openSheet('<h2>Der Troll ruft dir hinterher</h2><svg class="sheet-troll" viewBox="112 118 140 104" aria-hidden="true">' + trollArt(false) + '</svg>' +
        '<div class="say"><b>Troll</b>»Eine Sache noch, Konrad … BIERJUNGE!«</div>' +
        '<button class="btn primary" data-act="bierjunge" data-loc="' + loc.id + '">Hängt!</button>');
      return;
    }
    S.loc = loc.id; Sound.click();
    window.scrollTo(0, 0);
    if (!S.seen[loc.id]) {
      S.seen[loc.id] = true;
      if (loc.id === 'bruecke') afterRender.push(() => setTimeout(() => bubble('Na? Auch hier, um über meine Brücke zu latschen?'), 500));
      if (loc.id === 'forsthaus') { once.add('ghost'); setTimeout(() => Sound.creak(), 1700); setTimeout(() => Voice.say('konrad'), 2100); setTimeout(() => radio('Hast du das auch gesehen? Im Fenster? … Nein? Gut.'), 4600); setTimeout(() => radio('Komisch. Der Förster trägt dieselben Schuhe wie Marcel. Und wo ist Marcel eigentlich hin?'), 9000); }
      if (loc.id === 'salon') setTimeout(() => radio('Das Porträt ist von H. S. S. Er schaut immer so. Glauben wir.'), 900);
      if (loc.id === 'altar') { Sound.rumble(); setTimeout(() => radio('Raum 46. Wir kennen da jemanden, der sich darüber freut.'), 900); setTimeout(() => radio(COLOR_JOKES.altar), 5200); }
    }
  },
  bierjunge(el) {
    S.seen.bierjunge = true; trollCheers = false;
    Sound.tone(220, 0.3, 'triangle', 0.12);
    openSheet('<h2>Der Troll ist zufrieden</h2><svg class="sheet-troll" viewBox="112 118 140 104" aria-hidden="true">' + trollArt(false) + '</svg>' +
      '<div class="say"><b>Troll</b>»Hängt! Respekt, Konrad. Hier, nimm den mit. Für den Generator im Forsthaus. Prost!«</div>' +
      '<button class="btn primary" data-act="take" data-id="kanister" data-loc="' + el.dataset.loc + '">Kanister nehmen</button>');
  },
  take(el) {
    const id = el.dataset.id, item = TAKE[id];
    if (!item || has(id)) return;
    give(id); Sound.click(); buzz(30);
    toast(item.text, 'ok');
    if (id === 'amulett') setTimeout(() => Sound.creak(), 500);
    if (el.dataset.loc) { closeSheet(); actions.go(el); }
  },
  gateWheel(el) { spin(S.lock, el); },
  herringWheel(el) { spin(S.hlock, el); },
  gateTry() {
    if (matches(S.lock.join(''), ANSWER.lock)) {
      S.gate = true; stress(-12); once.add('gate');
      Sound.clunk(); setTimeout(() => Sound.creak(), 500); setTimeout(() => Sound.ok(), 1500); buzz(80);
      toast('Das Schloss fällt, das Tor knarrt auf. Dahinter führt ein Pfad zur Schlucht.', 'ok');
      window.scrollTo(0, 0);
    } else {
      const unheard = QUIPS.filter(q => !S.funkLog.includes(q));
      const quip = unheard.length ? pick(unheard) : '';
      if (quip) logFunk(quip);
      failure(quip); afterRender.push(() => shake('#gateLock'));
    }
  },
  herringTry() {
    if (matches(S.hlock.join(''), ANSWER.herring)) {
      S.herring = true; Sound.clunk(); Sound.splash(); unlock('hering');
      toast('In der Kiste: ein roter Hering. Eingelegt. Wir haben gesagt: NICHT öffnen.', 'ok');
    } else {
      failure('Die Kiste bleibt zu. Steht ja auch drauf.', 4); afterRender.push(() => shake('#herringLock'));
    }
  },
  takeUv() {
    if (S.uvTaken) return;
    S.uvTaken = true; give('uv'); Sound.click();
    radio('UV-Lampe eingepackt. Unten im Inventar kannst du sie einschalten.');
  },
  water() {
    Sound.tone(180, 0.3, 'square', 0.08, 0, 90); buzz([40, 30, 40]);
    afterRender.push(() => bubble('IGITT! Das ist ja STILLES Wasser!'));
    if (!S.ach.wasser) { unlock('wasser'); setTimeout(() => radio('Sorry, Konrad. Der Sprudel war aus. Wir sind ja keine Unmenschen.'), 2600); }
  },
  troll() {
    if (!S.lit) { Sound.tone(70, 0.6, 'sawtooth', 0.12, 0, 50); bubble('Mach erst mal Licht. Ich seh dich trotzdem.'); return; }
    Sound.tone(110, 0.25, 'triangle', 0.15, 0, 80); bubble(pick(TROLL_LINES));
  },
  item(el) { openItem(el.dataset.id); },
  use(el) { closeSheet(); useItem(el.dataset.id); },
  person(el) {
    const b = S.bridge, id = el.dataset.id;
    if (b.failed || crossAnim || !S.lit || S.bridgeDone) return;
    if (b.side[id] !== b.lamp) { toast('Die Laterne ist auf der anderen Seite.'); return; }
    if (b.sel.includes(id)) b.sel = b.sel.filter(x => x !== id);
    else if (b.sel.length < 2) b.sel.push(id);
    else toast('Höchstens zwei. Die Brücke hat schon genug durchgemacht.');
    Sound.click();
  },
  cross() {
    const b = S.bridge;
    if (!b.sel.length || b.failed || crossAnim) return;
    const dt = Math.max(...b.sel.map(id => walkTime(id, b)));
    const from = b.lamp, to = from === 'L' ? 'R' : 'L', ids = b.sel.slice();
    const ankleNow = ids.includes('du') && (b.konrad || 0) === KONRAD_SAFE_CROSSINGS - 1;
    if (ids.includes('du')) b.konrad = (b.konrad || 0) + 1;
    ids.forEach(id => { b.side[id] = to; });
    b.lamp = to; b.t += dt; b.sel = [];
    Sound.creak();
    crossAnim = { ids, from, dt };
    once.add('cross');
    const failedNow = b.t > BRIDGE_LIMIT;
    const allOver = PEOPLE.every(p => b.side[p.id] === 'R');
    afterRender.push(() => animateCrossing(() => {
      if (failedNow) {
        b.failed = true;
        Fx.lunge();
        failure('Die Laterne ist aus. Im Nebel war etwas. Ihr seid wieder am Anfang.', 15);
        setTimeout(() => { S.bridge = freshBridge(); save(); render(); }, 1800);
        save(); return;
      }
      if (ankleNow) {
        Fx.ambulance();
        setTimeout(() => toast('Umgeknickt, obwohl es keine Stelle gab, an der man stolpern kann. Nach dem Röntgen im Krankenhaus gibt es ab jetzt eine Schiene. Weiter geht’s, aber du humpelst: ab jetzt 2 Minuten pro Gang.', 'bad', 'Sanitäter'), 3600);
      }
      if (allOver) {
        S.bridgeDone = true; stress(-15); Sound.ok();
        S.fence = S.fence || newFenceRound();
        toast('Alle drüben, nach ' + b.t + ' Minuten. Der Troll schaut dir nachdenklich hinterher.', 'ok');
      }
      save(); render();
    }));
  },
  bridgeReset() { if (!crossAnim) { S.bridge = freshBridge(); Sound.click(); } },
  retort(el) {
    const f = S.fence, choice = f.opts[+el.dataset.i];
    const hit = choice === INSULTS[f.cur].retort;
    if (hit) {
      f.wins++; stress(-4); once.add('fhit');
      Sound.noise(0.25, 0.3, 3000, 0, 'bandpass', 1); Sound.tone(880, 0.12, 'square', 0.06, 0.1);
      toast(pick(FORESTER_HIT), 'ok', 'Förster');
      if (f.wins >= FENCE_WINS_NEEDED) {
        S.fenceDone = true; Sound.ok();
        setTimeout(() => toast('Der Förster reißt sich den Bart ab. Es ist Marcel. »Ich HASSE Verkleidungen. Das ist ja schlimmer als Karneval!« Dann hält Marcel dir einen Zettel hin.', 'ok', 'Förster'), 700);
        return;
      }
    } else {
      once.add('fmiss'); Sound.noise(0.3, 0.4, 1200, 0.15, 'bandpass', 2);
      failure('', 6);
      if (choice === AFFE) { unlock('affe'); toast('Netter Versuch. Falsches Spiel, Kumpel.', 'bad', 'Förster'); }
      else toast(pick(FORESTER_WIN), 'bad', 'Förster');
    }
    S.fence = newFenceRound(f, hit);
  },
  jug(el) {
    const i = +el.dataset.i;
    if (S.jugSel < 0) {
      if (S.jugs[i] === 0) { toast('Leer. Da gibt es nichts umzufüllen.'); return; }
      S.jugSel = i; Sound.click(); return;
    }
    if (S.jugSel === i) { S.jugSel = -1; return; }
    const from = S.jugSel, amount = Math.min(S.jugs[from], JUG_CAPS[i] - S.jugs[i]);
    S.jugSel = -1;
    if (amount === 0) { toast('Schon voll.'); return; }
    S.jugs[from] -= amount; S.jugs[i] += amount; S.jugMoves++; Sound.pour();
    if (S.jugs[0] === 4) {
      S.jugsDone = true; stress(-15);
      setTimeout(() => { Sound.clunk(); Sound.tone(60, 1.5, 'sawtooth', 0.12); Sound.ok(); Fx.flash(); }, 400);
      toast('Genau 4 Liter im Kanister. Ab in den Generator. Er springt an.', 'ok');
      setTimeout(() => radio(COLOR_JOKES.generator), 2600);
    }
  },
  jugReset() { S.jugs = [8, 0, 0]; S.jugSel = -1; S.jugMoves = 0; Sound.pour(); },
  chest(el) { if (!S.boxDone) { S.boxSel = el.dataset.id; Sound.tone(260, 0.08, 'triangle', 0.1); } },
  boxAsk() {
    const box = BOXES.find(b => b.id === S.boxSel);
    if (!box) return;
    openSheet('<h2>' + esc(box.name) + ' öffnen?</h2><p>Nur eine Kiste ist die richtige. Eine falsche kostet 3 Minuten.</p>' +
      '<div class="row"><button class="btn primary" data-act="boxOpen" data-id="' + box.id + '">Öffnen</button><button class="btn ghost" data-act="close">Doch nicht</button></div>');
  },
  boxOpen(el) {
    const id = el.dataset.id;
    closeSheet();
    once.add('chest-' + id);
    Sound.creak();
    if (matches('box:' + id, ANSWER.box)) {
      S.boxDone = true; stress(-15);
      setTimeout(() => Sound.ok(), 600);
      toast('Richtige Kiste. Im Samt liegt ein Amulett mit einem roten Stein.', 'ok');
    } else {
      S.opened.push(id); S.penalty += WRONG_BOX_COST; S.boxSel = '';
      afterRender.push(() => setTimeout(() => Fx.bats(document.getElementById('chest-' + id)), 350));
      failure('Leer. Bis auf das, was rausgeflogen ist. Drei Minuten weg. Hast du bei der Einweisung zugehört?', 14);
    }
  },
  slot(el) {
    const kind = el.dataset.kind, i = +el.dataset.i, pool = kind === 'items' ? ALTAR_ITEMS : RUNE_IDS;
    const cur = S.altar[kind][i], next = cur === null ? 0 : pool.indexOf(cur) + 1;
    S.altar[kind][i] = next >= pool.length ? null : pool[next];
    Sound.tone(kind === 'items' ? 330 : 495, 0.09, 'triangle', 0.08);
  },
  altarTry() {
    const a = S.altar;
    if (a.items.includes(null) || a.runes.includes(null)) { toast('Jeder Platz braucht ein Fundstück und eine Rune.'); return; }
    if (new Set(a.items).size < 4 || new Set(a.runes).size < 4) { toast('Jedes Fundstück und jede Rune gibt es nur einmal.'); return; }
    if (matches(a.items.join(',') + '|' + a.runes.join(','), ANSWER.altar)) {
      S.altarDone = true; S.finishedAt = Date.now(); finishAchievements();
      once.add('door'); Sound.rumble(); setTimeout(() => Sound.creak(), 400); buzz([100, 80, 300]);
      window.scrollTo(0, 0);
      setTimeout(() => { Fx.flash(); Sound.ok(); S.screen = 'finale'; save(); render(); window.scrollTo(0, 0); setTimeout(startFog, 30); }, 2700);
    } else {
      S.penalty += WRONG_ALTAR_COST; once.add('altarWrong'); Sound.whisper();
      failure('Der Altar bleibt stumm. Die 46 blutet. Eine Minute weg.', 10); afterRender.push(() => shake('#altarCard'));
    }
  },
  funk() { openFunk(); },
  hint() {
    const key = hintKey();
    S.hints[key] = (S.hints[key] || 0) + 1;
    payHint(); openFunk();
  },
  fenceAnswer() {
    if (!S.fence || S.fenceAnswers.includes(S.fence.cur)) return;
    S.fenceAnswers.push(S.fence.cur); payHint(); openFunk();
  },
  menu() {
    openSheet('<h2>Menü</h2><div class="row"><button class="btn" data-act="rules">Einweisung lesen</button>' +
      '<button class="btn" data-act="sound">Ton ' + (S.sound ? 'aus' : 'an') + '</button></div>' +
      '<div class="row"><button class="btn" data-act="funkArchive">Funkprotokoll</button></div>' +
      '<div class="row"><button class="btn" data-act="resetAsk">Neustart: zurück zum Anfang</button></div>' +
      '<div class="row"><button class="btn ghost" data-act="close">Schließen</button></div>');
  },
  funkArchive() {
    const list = S.funkLog.length
      ? '<ol class="funklog">' + S.funkLog.map(t => '<li>' + esc(t) + '</li>').join('') + '</ol>'
      : '<p class="hint-line">Noch kein Funkspruch. Oli schweigt. Noch.</p>';
    openSheet('<h2>Funkprotokoll</h2><p class="hint-line" style="text-align:left">Alles, was Oli bisher gefunkt hat.</p>' + list + '<button class="btn ghost" data-act="menu">Zurück</button>');
  },
  rules() { openSheet('<h2>Hausregeln</h2>' + briefingRules() + '<button class="btn" data-act="close">Zurück in den Wald</button>'); },
  sound() { S.sound = !S.sound; if (S.sound) { Sound.init(); Ambience.start(); Sound.click(); } Ambience.apply(); actions.menu(); },
  installApp() {
    if (installPrompt) { installPrompt.prompt(); installPrompt = null; return; }
    openSheet('<h2>Als App aufs Handy</h2>' +
      '<h3>iPhone (Safari)</h3><ol class="rules"><li><span>Unten auf „Teilen“ tippen (Quadrat mit Pfeil nach oben).</span></li><li><span>„Zum Home-Bildschirm“ wählen.</span></li><li><span>Oben rechts „Hinzufügen“.</span></li></ol>' +
      '<h3>Android (Chrome)</h3><ol class="rules"><li><span>Oben rechts auf ⋮ tippen.</span></li><li><span>„Zum Startbildschirm hinzufügen“ oder „App installieren“ wählen.</span></li><li><span>„Hinzufügen“ bestätigen.</span></li></ol>' +
      '<p class="hint-line">Danach startet die Prüfung über das Symbol auf deinem Startbildschirm.</p>' +
      '<button class="btn" data-act="close">Verstanden</button>');
  },
  resetAsk() {
    openSheet('<h2>Wirklich neu starten?</h2><p>Zeit, Fundstücke und Achievements sind dann weg.</p><div class="row"><button class="btn primary" data-act="reset">Neu starten</button><button class="btn ghost" data-act="close">Abbrechen</button></div>');
  },
  reset() {
    const sound = S.sound;
    S = freshState(); S.sound = sound; closeSheet();
    toastBox.innerHTML = ''; toastQueue.length = 0; pendingBubble = null; fxLayer.innerHTML = '';
    clearTimeout(uvTimer); trollCheers = false; crossAnim = null;
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nothing stored */ }
    window.scrollTo(0, 0);
  },
  close() { closeSheet(); },
};
function spin(arr, el) { const i = +el.dataset.i; arr[i] = (arr[i] + (+el.dataset.d) + 10) % 10; Sound.click(); }
function payHint() { S.penalty += HINT_COST; stress(5); Sound.tone(1200, 0.08, 'square', 0.05); Sound.noise(0.3, 0.1, 3000, 0.05); }

function openItem(id) {
  const it = ITEMS[id];
  const extra = id === 'schablone' ? '<div class="keygrid">' + Array.from({ length: 26 }, (_, i) => String.fromCharCode(65 + i)).map(l => '<div>' + pigpenSvg(l) + '<b>' + l + '</b></div>').join('') + '</div>' : '';
  const useLabel = id === 'uv' ? (S.uv ? 'Ausschalten' : 'Einschalten') : 'Hier benutzen';
  openSheet('<h2>' + esc(it.name) + '</h2><p>' + esc(it.desc) + '</p>' + extra +
    '<div class="row">' + (id === 'schablone' ? '' : '<button class="btn primary" data-act="use" data-id="' + id + '">' + useLabel + '</button>') +
    '<button class="btn ghost" data-act="close">Schließen</button></div>');
}
let uvTimer = 0, uvEndsAt = 0;
/** Seconds the UV lamp still burns, shown as a countdown on its inventory button. */
function uvSecondsLeft() { return Math.max(1, Math.ceil((uvEndsAt - Date.now()) / 1000)); }
/** Switches the UV lamp off without a re-render, so a running bridge animation or open choice is not interrupted. */
function uvOff() {
  if (!S.uv) return;
  S.uv = false;
  document.body.classList.remove('uv');
  const button = document.querySelector('.item[data-id="uv"]');
  if (button) button.classList.remove('active');
  const count = document.getElementById('uvCount');
  if (count) count.remove();
  Sound.tone(200, 0.15, 'sawtooth', 0.06);
  if (!S.seen.uvAkku) { S.seen.uvAkku = true; toast('UV-Lampe aus. Der Akku hält immer nur 10 Sekunden.'); }
  save();
}
function useItem(id) {
  if (id === 'uv') {
    S.uv = !S.uv; Sound.tone(S.uv ? 300 : 200, 0.15, 'sawtooth', 0.06);
    clearTimeout(uvTimer);
    if (S.uv) { uvEndsAt = Date.now() + UV_ON_MS; uvTimer = setTimeout(uvOff, UV_ON_MS); }
    if (S.uv && !S.seen.uv) { S.seen.uv = true; setTimeout(() => Fx.handprints(), 250); setTimeout(() => radio('Oh, Schwarzlicht. Profis lieben Schwarzlicht.'), 1800); }
    else if (S.uv) setTimeout(() => radio(COLOR_JOKES.uv), 1500);
    return;
  }
  if (id === 'laterne') {
    if (S.loc === 'bruecke' && !S.lit) { S.lit = true; Sound.tone(440, 0.4, 'triangle', 0.1); toast('Die Laterne brennt. Ab jetzt zählt jede Minute auf der Brücke.', 'ok'); afterRender.push(() => setTimeout(() => bubble('Ah. Licht. Hallo auch.'), 400)); }
    else toast('Sie leuchtet. Hier hilft das nichts.');
    return;
  }
  if (id === 'kanister') {
    if (S.loc === 'forsthaus' && S.fenceDone && !S.kanUsed) { S.kanUsed = true; Sound.pour(); toast('Kanister abgestellt. Jetzt sauber aufteilen.', 'ok'); }
    else if (S.loc === 'forsthaus' && !S.fenceDone) toast('Der Förster lässt dich nicht an den Schuppen.', '', 'Förster');
    else toast('Hier will keiner Diesel.');
    return;
  }
  if (id === 'hering') {
    if (S.loc === 'bruecke') { unlock('troll'); afterRender.push(() => bubble('Falsches Spiel, Kumpel. Ich bin hier nur Deko.')); }
    else toast('Riecht nach Ostsee und schlechten Entscheidungen.');
    return;
  }
  if (id === 'amulett') toast(S.loc === 'altar' ? 'Leg es auf einen Sockel. Tippe dafür unten auf einen Platz.' : 'Es wird wärmer. Irgendwo will es hin.');
}

function openFunk() {
  const key = hintKey(), entry = HINTS[key];
  let body;
  if (typeof entry === 'string') {
    body = '<p class="tip">' + esc(entry) + '</p>';
  } else {
    const got = S.hints[key] || 0;
    body = entry.slice(0, got).map((t, i) => '<p class="tip"><b>Tipp ' + (i + 1) + ':</b> ' + esc(t) + '</p>').join('');
    if (got < entry.length) body += '<button class="btn primary" data-act="hint">Tipp ' + (got + 1) + ' holen (−2:00)</button>';
    else if (key === 'foerster') {
      if (S.fenceAnswers.includes(S.fence.cur)) body += '<p class="tip"><b>Antwort:</b> »' + esc(INSULTS[S.fence.cur].retort) + '«</p>';
      else body += '<button class="btn primary" data-act="fenceAnswer">Antwort auf diese Beleidigung (−2:00)</button>';
    } else body += '<p class="hint-line">Mehr gibt der Funk nicht her.</p>';
  }
  openSheet('<h2>Funkgerät</h2><p class="hint-line" style="text-align:left">Kanal 3 · Oli. Jeder Tipp kostet 2 Minuten.</p>' + body + '<button class="btn ghost" data-act="close">Funk aus</button>');
}

let sheetOpen = false;
function openSheet(html) {
  closeSheet();
  const back = document.createElement('div');
  back.className = 'sheet-back'; back.id = 'sheet';
  back.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  back.addEventListener('click', e => { if (e.target === back) closeSheet(); });
  document.body.appendChild(back);
  sheetOpen = true;
}
function closeSheet() { const s = document.getElementById('sheet'); if (s) s.remove(); sheetOpen = false; }

// Silent on purpose: the protocol on the finale screen lists them, toasts would cover the opening door.
function finishAchievements() {
  const ms = elapsed(), now = Date.now();
  if (hintsUsed() === 0) S.ach.funk = now;
  if (ms < 20 * MINUTE) S.ach.speed = now;
  if (ms > DURATION) S.ach.overtime = now;
}

/* ================= event wiring ================= */
const SHEET_ACTIONS = ['funk', 'menu', 'funkArchive', 'installApp','item','boxAsk', 'rules', 'resetAsk', 'hint', 'fenceAnswer', 'sound', 'troll'];
const TAP_HEAVY = ['gateWheel', 'herringWheel', 'slot', 'jug', 'person', 'cross', 'chest', 'troll'];
document.addEventListener('click', e => {
  if (!instanceRunning) return;
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (!actions[act]) return;
  if (S.sound && act !== 'sound') {
    Sound.init();
    if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
    if (S.screen !== 'intro') Ambience.start();
  }
  const now = Date.now();
  lastAct = now;
  if (!TAP_HEAVY.includes(act)) {
    tapTimes = tapTimes.filter(t => now - t < 2000); tapTimes.push(now);
    if (tapTimes.length > 10 && now - lastViolenceNote > 30000 && S.screen === 'game') { lastViolenceNote = now; radio('Keine Gewalt anwenden! Steht in Regel 2.'); }
  }
  actions[act](el);
  save();
  if (!SHEET_ACTIONS.includes(act)) render();
});

/* ================= ticker ================= */
let lastIdle = 0, lastStressDecay = Date.now(), lastSave = 0, nextEyes = Date.now() + 40000;
function tick() {
  const timer = document.getElementById('timer');
  const uvCount = document.getElementById('uvCount');
  if (uvCount) uvCount.textContent = uvSecondsLeft();
  const p = pulseNow();
  const vig = document.getElementById('vig');
  const inGame = S.screen === 'game' && S.startedAt;
  vig.style.setProperty('--vig', inGame ? Math.min(0.75, Math.max(0, (p - 92) / 70)).toFixed(2) : 0);
  vig.style.setProperty('--beat', (60 / p).toFixed(2) + 's');
  vig.classList.toggle('throb', inGame && p >= 115);
  if (!timer) return;
  const rest = DURATION - elapsed();
  timer.textContent = (rest < 0 ? '+' : '') + fmt(rest);
  timer.className = 'timer' + (rest < 0 ? ' over' : rest < 5 * MINUTE ? ' low' : '');
  document.getElementById('bpm').textContent = p;
  const pulse = document.getElementById('pulse');
  pulse.style.setProperty('--beat', (60 / p).toFixed(2) + 's');
  pulse.classList.toggle('hot', p >= 130);
}
const ticker = setInterval(() => {
  if (S.screen !== 'game' || !S.startedAt) return;
  const now = Date.now();
  if (now - lastStressDecay > 4000) { stress(-1); lastStressDecay = now; }
  const p = pulseNow();
  if (p > S.maxPulse) S.maxPulse = p;
  if (p >= PULSE_ACHIEVEMENT) unlock('puls');
  tick();
  if (now > nextEyes) { nextEyes = now + 45000 + Math.random() * 50000; Backdrop.eyes(); }
  if (!sheetOpen && !blackoutRunning && now - lastAct > 75000 && now - lastIdle > 150000) {
    lastIdle = now; idleCount++;
    if (idleCount % 2) { Backdrop.runner(); Sound.steps(); setTimeout(() => Voice.say('hierDrueben'), 900); setTimeout(() => radio('Hast du das gesehen? Zwischen den Bäumen? … Wir auch nicht.'), 1600); }
    else radio('Hinter dir! Ein dreiköpfiger Affe! … Nein? Na gut. Weiter.');
  }
  if (!S.seen.half && elapsed() >= HALFTIME && !sheetOpen && !crossAnim) { S.seen.half = true; save(); Fx.blackout(); }
  if (!S.seen.over && DURATION - elapsed() < 0) { S.seen.over = true; Sound.thunder(); Fx.flash(); radio('Die 30 Minuten sind um. Wir machen weiter. Rausgelassen wirst du trotzdem.', 'bad'); }
  if (now - lastSave > 5000) { lastSave = now; save(); }
}, 250);

/* ================= finale fog ================= */
function startFog() {
  const c = document.getElementById('fog');
  if (!c || reducedMotion) return;
  const ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const blobs = Array.from({ length: 26 }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, r: 120 + Math.random() * 220, vx: (Math.random() - 0.5) * 0.6, vy: -0.2 - Math.random() * 0.4 }));
  let alive = true;
  const draw = () => {
    if (!alive) return;
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#0b1210'; ctx.globalAlpha = 0.55; ctx.fillRect(0, 0, c.width, c.height); ctx.globalAlpha = 1;
    blobs.forEach(b => {
      b.x += b.vx; b.y += b.vy;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, 'rgba(190,205,198,.55)'); g.addColorStop(1, 'rgba(190,205,198,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(draw);
  };
  draw();
  setTimeout(() => { c.style.opacity = '0'; }, 1200);
  setTimeout(() => { alive = false; c.remove(); }, 6200);
}

/* ================= boot ================= */
function start(data) {
  const restored = (data && data.state) || loadStored();
  if (restored && restored.v === 1) S = Object.assign(freshState(), restored);
  if (S.bridge.failed) S.bridge = freshBridge();
  S.uv = false;
  if (!document.hidden) resumeClock();
  if (S.bridgeDone && !S.fenceDone && !S.fence) S.fence = newFenceRound();
  if (S.screen === 'brief' && !S.briefOpenedAt) S.briefOpenedAt = Date.now();
  Backdrop.start();
  render();
}
/** Silences and stops this copy; the next copy calls it when the viewer loads a newer version into the page. */
function stopInstance() {
  instanceRunning = false;
  clearInterval(ticker); clearInterval(Ambience.timer);
  if (Sound.ctx && Sound.ctx.state !== 'closed') Sound.ctx.close();
}
if (typeof window.__eruevStop === 'function') window.__eruevStop();
window.__eruevStop = stopInstance;
// Start directly: localStorage already resumes the run, so the viewer's hot-update hook is only a bonus.
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ state: S }));
start(hot && hot.data ? hot.data : {});
})();
</script>
